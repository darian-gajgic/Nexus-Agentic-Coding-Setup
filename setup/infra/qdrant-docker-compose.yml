# Qdrant vector store for mem0 (SERVER mode, so both the Hermes gateway AND the
# nexus Memory tab can read it concurrently — embedded/file mode is single-process).
# Localhost-bound. restart:"no" (quoted — bare no is a YAML boolean): manual-start
# posture since 2026-07-11 — nothing auto-starts at boot; `nexus-up` starts it.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: "no"
    ports:
      - 127.0.0.1:6333:6333
      - 127.0.0.1:6334:6334
    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  qdrant_storage:
    driver: local
